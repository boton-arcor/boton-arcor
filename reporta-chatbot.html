<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot-ON — Parte de novedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #10141b;
    --bg-2: #1a212b;
    --paper: #fbf7ee;
    --paper-line: #e3dac4;
    --ink: #2a2620;
    --ink-soft: #7a715e;
    --amber: #e2a73e;
    --amber-deep: #a9711a;
    --teal: #3e7c7b;
    --danger: #b24a3d;
    --radius-card: 14px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #202a38 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1c2431 0%, transparent 50%),
      var(--bg-1);
    font-family:'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 14px;
  }

  .desk-label{
    position:fixed;
    top:20px; left:50%;
    transform:translateX(-50%);
    color:#5b6472;
    font-size:12px;
    letter-spacing:.02em;
    font-family:'Inter',sans-serif;
    text-align:center;
    line-height:1.5;
  }

  .app{
    width:100%;
    max-width: 430px;
    display:flex;
    flex-direction:column;
  }

  .ticket{
    background: var(--paper);
    border-radius: var(--radius-card);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.03) inset;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height: 640px;
    position:relative;
  }

  /* perforated top edge */
  .perf{
    height:14px;
    background:
      radial-gradient(circle at center, var(--bg-1) 3px, transparent 3.2px) repeat-x;
    background-size: 18px 14px;
    background-position: 9px center;
    flex-shrink:0;
  }

  header{
    padding: 4px 20px 14px;
    border-bottom: 1px dashed var(--paper-line);
    flex-shrink:0;
  }

  .header-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .avatar{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .avatar svg{ display:block; }

  .header-text h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 19px;
    margin:0;
    color: var(--ink);
  }

  .slogan{
    margin: 8px 0 0;
    font-size:12px;
    color: var(--ink-soft);
  }

  .steps{
    display:flex;
    gap: 6px;
    margin-top: 14px;
  }

  .step{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .step .bar{
    height:3px;
    border-radius:2px;
    background: var(--paper-line);
    transition: background .4s ease;
  }
  .step.done .bar{ background: var(--amber); }
  .step.active .bar{ background: var(--ink-soft); }

  .step .label{
    font-size:10px;
    color: var(--ink-soft);
    transition: color .3s ease;
  }
  .step.done .label{ color: var(--amber-deep); }
  .step.active .label{ color: var(--ink); }

  .chat{
    flex:1;
    overflow-y:auto;
    padding: 18px 20px 10px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{ width:6px; }
  .chat::-webkit-scrollbar-thumb{ background: var(--paper-line); border-radius:3px; }

  .bot-msg{
    display:flex;
    gap:10px;
    max-width: 100%;
    animation: rise .35s ease both;
  }
  .bot-msg .bullet{
    width:2px;
    background: var(--amber);
    border-radius:2px;
    flex-shrink:0;
  }
  .bot-msg .text{
    font-size:14.5px;
    line-height:1.5;
    padding-top:1px;
  }
  .bot-msg .text b{ font-weight:600; }

  .typing{
    display:flex;
    gap:5px;
    padding: 4px 0 4px 12px;
  }
  .typing span{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--ink-soft);
    opacity:.5;
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }

  @keyframes blink{
    0%,80%,100%{ transform:scale(.7); opacity:.35; }
    40%{ transform:scale(1); opacity:.9; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* filled ticket line (user's answer) */
  .entry{
    align-self:flex-end;
    max-width: 86%;
    animation: rise .3s ease both;
  }
  .entry .field-label{
    font-size:10.5px;
    color: var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:flex-end;
    margin-bottom:4px;
  }
  .entry .field-label .dot{
    width:5px;height:5px;border-radius:50%;
    background: var(--amber);
  }
  .entry .field-value{
    font-size:14px;
    text-align:right;
    border-bottom: 1.5px solid var(--amber);
    padding-bottom:4px;
    color: var(--ink);
  }
  .entry .edit-link{
    display:block;
    text-align:right;
    font-size:10.5px;
    color: var(--teal);
    margin-top:5px;
    cursor:pointer;
    text-decoration:none;
  }
  .entry .edit-link:hover{ text-decoration:underline; }

  .photo-entry{ align-self:flex-end; }
  .polaroid{
    background:#fff;
    padding:6px 6px 22px;
    box-shadow: 0 6px 14px rgba(0,0,0,.18);
    transform: rotate(-3deg);
    width:150px;
    position:relative;
    margin-left:auto;
  }
  .polaroid img{
    width:100%;
    height:110px;
    object-fit:cover;
    display:block;
    background:#eee;
  }
  .polaroid .tape{
    position:absolute;
    top:-10px; left:50%;
    transform:translateX(-50%) rotate(-2deg);
    width:52px; height:18px;
    background: rgba(226,167,62,.55);
    border: 1px solid rgba(226,167,62,.3);
  }
  .polaroid .cap{
    position:absolute;
    bottom:5px; left:0; right:0;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:11px;
    color: var(--ink-soft);
  }

  /* input dock */
  .dock{
    border-top: 1px dashed var(--paper-line);
    padding: 14px 20px 18px;
    flex-shrink:0;
    background: var(--paper);
  }

  .foto-botones{
    display:flex;
    gap:10px;
  }
  .foto-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 20px 10px;
    border: 1.5px dashed var(--paper-line);
    border-radius:10px;
    background:transparent;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, color .2s ease;
  }
  .foto-btn:hover, .foto-btn:active{
    border-color: var(--amber);
    background: rgba(226,167,62,.08);
    color: var(--amber-deep);
  }
  .foto-btn svg{ color: var(--ink-soft); }
  .foto-btn:hover svg, .foto-btn:active svg{ color: var(--amber-deep); }

  .line-input{
    width:100%;
    border:none;
    border-bottom: 1.5px solid var(--paper-line);
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color: var(--ink);
    padding: 6px 2px 9px;
    outline:none;
    transition: border-color .2s ease;
  }
  .line-input:focus{ border-color: var(--amber); }
  .line-input::placeholder{ color:#b4ab97; }

  textarea.line-input{
    resize:none;
    min-height:64px;
    line-height:1.5;
    font-size:14.5px;
  }

  .go-btn{
    margin-top:12px;
    width:100%;
    background: var(--ink);
    color: var(--amber);
    border:none;
    border-radius:9px;
    padding: 12px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition: transform .12s ease, background .2s ease;
  }
  .go-btn:hover{ background:#3a3428; }
  .go-btn:active{ transform: scale(.98); }
  .go-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .go-btn.send{ background: var(--amber-deep); color:#fff8ea; }
  .go-btn.send:hover{ background:#8f5f16; }

  /* summary */
  .summary-card{
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:14px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-self:stretch;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:13px;
  }
  .summary-row .k{ color: var(--ink-soft); flex-shrink:0; }
  .summary-row .v{ text-align:right; }

  .stamp{
    position:absolute;
    top:44%; left:50%;
    transform:translate(-50%,-50%) rotate(-10deg) scale(.7);
    opacity:0;
    border: 3px double var(--amber-deep);
    color: var(--amber-deep);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:26px;
    padding: 6px 18px;
    border-radius:8px;
    background: rgba(251,247,238,.85);
    pointer-events:none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .stamp.show{
    opacity:1;
    transform:translate(-50%,-50%) rotate(-10deg) scale(1);
  }

  .sim-note{
    text-align:center;
    font-size:11px;
    color: var(--ink-soft);
    font-style:italic;
    margin-top:10px;
    line-height:1.5;
  }

  @media (max-width:480px){
    .ticket{ height: 88vh; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="ticket">
    <div class="perf"></div>

    <header>
      <div class="header-row">
        <div class="avatar">
          <svg width="26" height="26" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="19" fill="#2C5DA8" stroke="#1E4278" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="15" fill="#F5C518" stroke="#D9A80E" stroke-width="1"/>
            <line x1="16.5" y1="16.5" x2="23.5" y2="23.5" stroke="#2C5DA8" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="23.5" y1="16.5" x2="16.5" y2="23.5" stroke="#2C5DA8" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="16.5" cy="16.5" r="1.9" fill="#2C5DA8"/>
            <circle cx="23.5" cy="16.5" r="1.9" fill="#2C5DA8"/>
            <circle cx="16.5" cy="23.5" r="1.9" fill="#2C5DA8"/>
            <circle cx="23.5" cy="23.5" r="1.9" fill="#2C5DA8"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>Bot-ON</h1>
        </div>
      </div>
      <p class="slogan">De la calle a la mejora, en un solo lugar</p>
      <div class="steps" id="steps">
        <div class="step" data-step="photo"><div class="bar"></div><div class="label">Foto</div></div>
        <div class="step" data-step="address"><div class="bar"></div><div class="label">Dirección</div></div>
        <div class="step" data-step="comment"><div class="bar"></div><div class="label">Comentario</div></div>
      </div>
    </header>

    <div class="chat" id="chat"></div>

    <div class="dock" id="dock"></div>
  </div>
</div>

<script>
(function(){
  const chat = document.getElementById('chat');
  const dock = document.getElementById('dock');
  const stepsEl = document.getElementById('steps');

  const data = { photo:null, photoName:'', address:'', comment:'' };

  function setStepState(name, state){
    const el = stepsEl.querySelector('.step[data-step="'+name+'"]');
    if(!el) return;
    el.classList.remove('active','done');
    if(state) el.classList.add(state);
  }

  function scrollDown(){
    requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; });
  }

  function botTyping(cb, delay){
    const t = document.createElement('div');
    t.className = 'bot-msg';
    t.innerHTML = '<div class="bullet"></div><div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(t);
    scrollDown();
    setTimeout(()=>{
      t.remove();
      cb();
    }, delay || 650);
  }

  function botSay(html){
    const m = document.createElement('div');
    m.className = 'bot-msg';
    m.innerHTML = '<div class="bullet"></div><div class="text">'+html+'</div>';
    chat.appendChild(m);
    scrollDown();
  }

  function userLine(label, value, editStep){
    const e = document.createElement('div');
    e.className = 'entry';
    e.innerHTML =
      '<div class="field-label"><span class="dot"></span>'+label+'</div>'+
      '<div class="field-value">'+value+'</div>'+
      (editStep ? '<a class="edit-link" data-edit="'+editStep+'">editar</a>' : '');
    chat.appendChild(e);
    scrollDown();
    e.querySelectorAll('[data-edit]').forEach(a=>{
      a.addEventListener('click', ()=> goToStep(a.dataset.edit));
    });
  }

  function userPhoto(dataUrl, name, editStep){
    const e = document.createElement('div');
    e.className = 'photo-entry';
    e.innerHTML =
      '<div class="polaroid"><div class="tape"></div><img src="'+dataUrl+'" alt="Foto cargada"><div class="cap">'+name+'</div></div>'+
      (editStep ? '<a class="edit-link" data-edit="'+editStep+'" style="margin-top:6px;">editar</a>' : '');
    chat.appendChild(e);
    scrollDown();
    e.querySelectorAll('[data-edit]').forEach(a=>{
      a.addEventListener('click', ()=> goToStep(a.dataset.edit));
    });
  }

  function clearDock(){ dock.innerHTML = ''; }

  function goToStep(name){
    if(name === 'photo') renderPhotoStep();
    else if(name === 'address') renderAddressStep();
    else if(name === 'comment') renderCommentStep();
  }

  // --- STEP 1: PHOTO ---
  function renderPhotoStep(){
    setStepState('photo','active');
    clearDock();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="foto-botones">
        <button type="button" class="foto-btn" id="btnCamara">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
          <span>Sacar foto</span>
        </button>
        <button type="button" class="foto-btn" id="btnGaleria">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-9 8"/></svg>
          <span>Elegir de galería</span>
        </button>
      </div>
      <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="inputGaleria" accept="image/*" style="display:none">
    `;
    dock.appendChild(wrap);
    const inputCamara = wrap.querySelector('#inputCamara');
    const inputGaleria = wrap.querySelector('#inputGaleria');

    wrap.querySelector('#btnCamara').addEventListener('click', ()=> inputCamara.click());
    wrap.querySelector('#btnGaleria').addEventListener('click', ()=> inputGaleria.click());

    [inputCamara, inputGaleria].forEach(inp=>{
      inp.addEventListener('change', e=>{
        const f = e.target.files[0];
        if(f) handleFile(f);
      });
    });

    function handleFile(f){
      compressImage(f, 1280, 0.72).then(dataUrl=>{
        data.photo = dataUrl;
        data.photoName = f.name;
        setStepState('photo','done');
        userPhoto(data.photo, f.name, 'photo');
        clearDock();
        botTyping(()=> botSay('Perfecto recibido, indicame la dirección del lugar.'), 550);
        setTimeout(renderAddressStep, 950);
      });
    }
  }

  // Redimensiona y comprime la imagen en el navegador antes de mandarla,
  // para que en datos móviles el envío sea mucho más rápido.
  function compressImage(file, maxWidth, quality){
    return new Promise((resolve)=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxWidth){
            h = Math.round(h * (maxWidth / w));
            w = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = ()=> resolve(ev.target.result); // si falla, usamos el original sin comprimir
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // --- STEP 2: ADDRESS ---
  function renderAddressStep(){
    setStepState('address','active');
    clearDock();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <input class="line-input" id="addrInput" type="text" placeholder="Calle, altura y localidad" value="${data.address ? data.address.replace(/"/g,'&quot;') : ''}">
      <button class="go-btn" id="addrBtn" disabled>Continuar</button>
    `;
    dock.appendChild(wrap);
    const input = wrap.querySelector('#addrInput');
    const btn = wrap.querySelector('#addrBtn');
    input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length < 4; });
    input.dispatchEvent(new Event('input'));
    input.focus();
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) btn.click(); });

    btn.addEventListener('click', ()=>{
      data.address = input.value.trim();
      setStepState('address','done');
      userLine('Dirección', data.address, 'address');
      clearDock();
      botTyping(()=> botSay('Perfecto. Contame en pocas palabras qué pasó ahí.'), 550);
      setTimeout(renderCommentStep, 950);
    });
  }

  // --- STEP 3: COMMENT + ENVÍO ---
  function renderCommentStep(){
    setStepState('comment','active');
    clearDock();
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <textarea class="line-input" id="commentInput" placeholder="Describí la novedad brevemente...">${data.comment || ''}</textarea>
      <button class="go-btn send" id="commentBtn" disabled>Enviar por mail</button>
    `;
    dock.appendChild(wrap);
    const input = wrap.querySelector('#commentInput');
    const btn = wrap.querySelector('#commentBtn');
    input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length < 3; });
    input.dispatchEvent(new Event('input'));
    input.focus();

    btn.addEventListener('click', ()=>{
      data.comment = input.value.trim();
      setStepState('comment','done');
      userLine('Comentario', data.comment, 'comment');

      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <div class="summary-row"><div class="k">Foto</div><div class="v">${data.photoName || '—'}</div></div>
        <div class="summary-row"><div class="k">Dirección</div><div class="v">${data.address}</div></div>
        <div class="summary-row"><div class="k">Comentario</div><div class="v">${data.comment}</div></div>
      `;
      chat.appendChild(card);
      scrollDown();

      clearDock();
      sendReport();
    });
  }

  // --- ENVÍO REAL ---
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2mFs_yfErRqgHd3RrUN3ou1yQnI97CAEISpePrSyinI2wrNi0839cpHUGHf4uq5hY/exec';

  function sendReport(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<button class="go-btn send" id="sendBtn" disabled>Enviando...</button>`;
    dock.appendChild(wrap);
    const sendBtn = wrap.querySelector('#sendBtn');

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no devuelve headers CORS; no-cors evita que el navegador bloquee el pedido
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight OPTIONS
      body: JSON.stringify({
        direccion: data.address,
        comentario: data.comment,
        fotoBase64: data.photo,
        fotoNombre: data.photoName
      })
    })
    .then(()=>{
      // con mode:'no-cors' no podemos leer la respuesta real del script,
      // así que si el fetch no tiró error de red, asumimos que se envió.
      clearDock();
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      stamp.textContent = 'Enviado';
      document.querySelector('.ticket').appendChild(stamp);
      requestAnimationFrame(()=> stamp.classList.add('show'));

      botTyping(()=> {
        botSay('Listo, el mail con la foto, la dirección y el comentario ya salió hacia tu casilla.');
        const restartWrap = document.createElement('div');
        restartWrap.innerHTML = `<button class="go-btn" id="restartBtn">Bot-ONear nuevamente</button>`;
        dock.innerHTML = '';
        dock.appendChild(restartWrap);
        restartWrap.querySelector('#restartBtn').addEventListener('click', resetFlow);
      }, 700);

      setTimeout(()=> stamp.classList.remove('show'), 2600);
    })
    .catch(()=>{
      clearDock();
      const retryWrap = document.createElement('div');
      retryWrap.innerHTML = `<button class="go-btn send" id="retryBtn">Reintentar envío</button>`;
      dock.appendChild(retryWrap);
      retryWrap.querySelector('#retryBtn').addEventListener('click', sendReport);
      botTyping(()=> botSay('Uh, no se pudo conectar para enviar el mail. Revisá tu conexión e intentá de nuevo.'), 500);
    });
  }

  // --- INICIO / REINICIO ---
  function startFlow(){
    botTyping(()=>{
      botSay('¡Hola! Soy <b>Bot-ON</b>. Vamos a dejar todo registrado en tres pasos — arrancá mandándome una foto.');
      renderPhotoStep();
    }, 500);
  }

  function resetFlow(){
    data.photo = null;
    data.photoName = '';
    data.address = '';
    data.comment = '';
    ['photo','address','comment'].forEach(s => setStepState(s, null));
    chat.innerHTML = '';
    clearDock();
    const oldStamp = document.querySelector('.ticket .stamp');
    if(oldStamp) oldStamp.remove();
    startFlow();
  }

  startFlow();
})();
</script>
